name: Check new upstream content

on:
  schedule:
    - cron: "0 12 * * *" # daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: Foundryborne/daggerheart
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect newer upstream release and diff
        id: diff
        run: |
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          current=$(tr -d '[:space:]' < .upstream-version)
          l=${latest#v}; c=${current#v}
          newest=$(printf '%s\n%s\n' "$c" "$l" | sort -V | tail -1)
          if [ "$l" = "$c" ] || [ "$newest" != "$l" ]; then
            echo "Up to date ($current, latest $latest)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$UPSTREAM" upstream
          # tags may or may not carry a "v" prefix
          resolve() { for t in "$1" "v${1#v}" "${1#v}"; do git -C upstream rev-parse -q --verify "refs/tags/$t" >/dev/null && { echo "$t"; return; }; done; echo "$1"; }
          old_tag=$(resolve "$current"); new_tag=$(resolve "$latest")
          git -C upstream diff "$old_tag" "$new_tag" -- lang/en.json packs/ > diff.patch
          echo "current=$old_tag" >> "$GITHUB_OUTPUT"
          echo "latest=$new_tag" >> "$GITHUB_OUTPUT"
          if [ -s diff.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Open issue
        if: steps.diff.outputs.changed == 'true'
        env:
          CUR: ${{ steps.diff.outputs.current }}
          NEW: ${{ steps.diff.outputs.latest }}
        run: |
          title="Upstream Daggerheart mudou: $CUR -> $NEW"
          if gh issue list --state open --label upstream-sync --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue already exists"; exit 0
          fi
          gh label create upstream-sync --color 0E8A16 2>/dev/null || true
          compare="https://github.com/$UPSTREAM/compare/$CUR...$NEW"
          {
            echo "Houve mudanças em \`lang/en.json\` e/ou \`packs/\` no sistema Daggerheart upstream entre **$CUR** e **$NEW**."
            echo
            echo "Comparação completa: $compare"
            echo
            echo '<details>'
            echo '<summary>Ver diff</summary>'
            echo
            echo '```diff'
            head -c 60000 diff.patch
            echo
            echo '```'
            echo
            echo '</details>'
            echo
            [ "$(wc -c < diff.patch)" -gt 60000 ] && echo "_Diff truncado; veja a comparação completa no link acima._"
          } > body.md
          old=$(gh issue list --state open --label upstream-sync --json number --jq '.[].number')
          url=$(gh issue create --label upstream-sync --title "$title" --body-file body.md)
          for n in $old; do
            gh issue close "$n" --reason "not planned" --comment "Substituída por $url, que mostra as mudanças mais recentes ($NEW)."
          done
